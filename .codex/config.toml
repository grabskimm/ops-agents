# Codex project config for ops-agents. Subagents inherit sandbox_mode, approval_policy and mcp_servers.
# All remote MCP servers use OAuth (`codex mcp login <name>`); GitHub reuses gh's OAuth token with a read-only header.

approval_policy = "on-request"      # execute-tier actions pause for approval
sandbox_mode    = "workspace-write" # never "danger-full-access"

[agents]
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"

[mcp_servers.github_ro]
url = "https://api.githubcopilot.com/mcp/"
http_headers = { Authorization = "Bearer ${GH_OAUTH_TOKEN}", X-MCP-Readonly = "true" }

[mcp_servers.github_rw]
url = "https://api.githubcopilot.com/mcp/"
http_headers = { Authorization = "Bearer ${GH_OAUTH_TOKEN}" }

[mcp_servers.cloudflare]
url = "https://mcp.cloudflare.com/mcp"

[mcp_servers.vercel]
url = "https://mcp.vercel.com"

[mcp_servers.supabase]
url = "https://mcp.supabase.com/mcp?read_only=true&project_ref=${SUPABASE_PROJECT_REF}"
